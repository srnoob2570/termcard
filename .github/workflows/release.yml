name: Release

on:
    push:
        tags:
            - "v*"

jobs:
    build:
        permissions:
            contents: write
        # runs-on: ubuntu-latest
        # GTK/WebKit system libs are baked into the cron-runner image; no
        # sudo apt-get possible on that runner. Rust toolchain is installed
        # per-run (user-local rustup, no sudo needed).
        runs-on: [self-hosted, cron-runner]
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - uses: oven-sh/setup-bun@v2

            - name: Install frontend dependencies
              run: bun install

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: ${{ github.ref_name }}
                  releaseDraft: false
                  prerelease: false
