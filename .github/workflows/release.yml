name: Release

on:
    push:
        tags:
            - "v*"

jobs:
    build:
        permissions:
            contents: write
        # runs-on: ubuntu-latest
        # GTK/WebKit system libs are baked into the cron-runner image; no
        # sudo apt-get possible on that runner. Rust toolchain is installed
        # per-run (user-local rustup, no sudo needed).
        runs-on: [self-hosted, cron-runner]
        steps:
            - uses: actions/checkout@v6

            - uses: dtolnay/rust-toolchain@stable
              env:
                  # Image ships RUSTUP_HOME/CARGO_HOME under /usr/local (not
                  # writable by the job user); install user-local instead.
                  RUSTUP_HOME: ${{ runner.temp }}/rustup
                  CARGO_HOME: ${{ runner.temp }}/cargo

            - uses: oven-sh/setup-bun@v2

            - name: Install frontend dependencies
              run: bun install

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Small runner host: cargo dies mid-compile (OOM) with
                  # default parallel jobs.
                  CARGO_BUILD_JOBS: "1"
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: ${{ github.ref_name }}
                  releaseDraft: false
                  prerelease: false
