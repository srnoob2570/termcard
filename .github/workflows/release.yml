name: Release

on:
    push:
        tags:
            - "v*"

jobs:
    build:
        permissions:
            contents: write
        runs-on: ubicloud-standard-2
        steps:
            - uses: actions/checkout@v6

            # Same list the GitHub-hosted Tauri runner images use, plus
            # rpm (bundle target) and xdg-utils (xdg-open, needed by
            # linuxdeploy during AppImage bundling).
            - name: Cache apt packages
              uses: actions/cache@v4
              with:
                  path: /var/cache/apt/archives
                  key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils rpm

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - uses: oven-sh/setup-bun@v2

            - uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

            - name: Install frontend dependencies
              run: bun install --frozen-lockfile

            # Extract this tag's section from CHANGELOG.md as the release
            # body. tauri-action overwrites the body on every run, so without
            # releaseBody it resets an existing release to an empty body.
            - name: Extract changelog section
              id: notes
              run: |
                  {
                      echo "body<<EOF"
                      awk -v t="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\["t"\\]"{p=1; next} /^## \[/{p=0} p' CHANGELOG.md
                      echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: ${{ github.ref_name }}
                  releaseBody: ${{ steps.notes.outputs.body }}
                  releaseDraft: false
                  prerelease: false
