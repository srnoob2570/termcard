name: Release

on:
    push:
        tags:
            - "v*"

jobs:
    build:
        permissions:
            contents: write
        # runs-on: ubuntu-latest
        # GTK/WebKit system libs are baked into the cron-runner image; no
        # sudo apt-get possible on that runner. Rust toolchain installs
        # per-run and persists via CARGO_HOME/RUSTUP_HOME on the runner
        # cache volume (set in the cron-runner compose file).
        runs-on: [self-hosted, cron-runner]
        steps:
            - uses: actions/checkout@v6

            - uses: dtolnay/rust-toolchain@stable

            - uses: oven-sh/setup-bun@v2

            - name: Install frontend dependencies
              run: bun install

            # Extract this tag's section from CHANGELOG.md as the release
            # body. tauri-action overwrites the body on every run, so without
            # releaseBody it resets an existing release to an empty body.
            - name: Extract changelog section
              id: notes
              run: |
                  {
                      echo "body<<EOF"
                      awk -v t="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\["t"\\]"{p=1; next} /^## \[/{p=0} p' CHANGELOG.md
                      echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: ${{ github.ref_name }}
                  releaseBody: ${{ steps.notes.outputs.body }}
                  releaseDraft: false
                  prerelease: false
